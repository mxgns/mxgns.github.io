<h1 data-pagefind-meta="title">Guestbook</h1>
<div class="post-body"><p>Leave a message in my guestbook. Feel free to just say hello or share a thought on something I posted.</p>
<!-- guestbook -->

<style>
.guestbook {
  --guestbook-card-bg: var(--grey-100);
  --guestbook-accent: var(--black);
  --guestbook-accent-text: var(--white);
  --guestbook-error-color: var(--pink-600);
  --guestbook-required-color: var(--pink-600);
  --guestbook-border-color: var(--grey-300);
  --guestbook-avatar-color-0: var(--card-blue);
  --guestbook-avatar-text-0: var(--card-blue-text);
  --guestbook-avatar-color-1: var(--card-brown);
  --guestbook-avatar-text-1: var(--card-brown-text);
  --guestbook-avatar-color-2: var(--card-green);
  --guestbook-avatar-text-2: var(--card-green-text);
  --guestbook-avatar-color-3: var(--card-yellow);
  --guestbook-avatar-text-3: var(--card-yellow-text);
  --guestbook-avatar-color-4: var(--card-pink);
  --guestbook-avatar-text-4: var(--card-pink-text);
  --guestbook-avatar-color-5: var(--card-beige);
  --guestbook-avatar-text-5: var(--card-beige-text);
  --guestbook-author-badge-label: "MXGNS";
}

/* Same photo/technique as .avatar.author-magnus in style.css -- background-image clips to the
   circle via the existing border-radius: 50% on .guestbook-avatar, no overflow: hidden needed. */
.guestbook .guestbook-entry.guestbook-author .guestbook-avatar {
  background-image: url("resources/magnus.jpg");
  background-size: cover;
  background-position: center;
}

.guestbook .guestbook-entry.guestbook-author .guestbook-avatar::before {
  content: none;
}

/* Match the comment author badge's look (h4.author.author-magnus::after in style.css):
   smaller, trailing the name, same line-height/padding trick. magbook's own default is a
   ::before specifically to avoid colliding with .post-body a.external-link::after on a linked
   name -- overriding to ::after here reopens that collision for an author entry that also has
   a website set, accepted as a narrow edge case for a personal guestbook. */
.guestbook .guestbook-entry.guestbook-author .guestbook-entry-name::before {
  content: none;
}

.guestbook .guestbook-entry.guestbook-author .guestbook-entry-name::after {
  content: var(--guestbook-author-badge-label, "Author");
  margin-left: 0.4em;
  padding: 0 0.4em;
  line-height: 1.6;
  border-radius: 0.2em;
  background: var(--guestbook-author-badge-bg, #1a1a1a);
  color: var(--guestbook-author-badge-text, #fff);
  font-size: 0.6rem;
  font-weight: 700;
  letter-spacing: 0.05em;
}

/* Icon-only by default: the button's own text ("Delete entry"/"Confirm deletion", set by
   magbook) stays in the DOM for accessibility, just clipped by max-width + overflow: hidden
   -- the icon (fixed-size ::before, never clipped) is what's actually visible. Growing
   max-width on --confirming reveals the text and, since this button is the last flex child in
   .guestbook-entry with nothing to its right, the growth can only extend leftward into the
   entry content's flex: 1 space -- "grows in place to the left" falls out of the layout that
   already exists, no new positioning needed. Same mask-image technique as .back-link::before
   in style.css, just a different icon. */
.guestbook .guestbook-entries--can-delete .guestbook-delete-button {
  display: inline-flex;
  align-items: center;
  gap: 0.35em;
  overflow: hidden;
  white-space: nowrap;
  max-width: 1.8em;
  padding: 0.3em;
  border-radius: 0.3em;
  transition: max-width 0.2s ease, padding 0.2s ease, background-color 0.2s ease,
    border-color 0.2s ease, color 0.2s ease;
}

  display: inline-block;
  flex-shrink: 0;
